; Configuración de las pruebas del backend.
;
; ⛔ POR QUÉ EXISTE ESTE ARCHIVO. Sin él pytest sale a recorrer TODO el repo buscando
; pruebas, y este repo tiene dentro un entorno virtual con miles de archivos
; (`.venv` es un enlace a `.venv.nosync`, que a su vez cuelga de ~/Documents, o sea de
; iCloud). Cada stat en esa carpeta puede quedarse esperando a que el proveedor de
; archivos de macOS materialice algo, y entonces `pytest` no falla: se QUEDA. El
; 2026-07-28 una recolección tardó 3 minutos 32 con la caché fría y varias corridas se
; apilaron colgadas hasta que hubo que matarlas a mano. Con `testpaths` fijos pytest
; sólo mira los siete archivos de este repo y no pisa el entorno virtual jamás.
[pytest]
testpaths =
    test_acuerdo.py
    test_avisos_y_proveedores.py
    test_chat_negocio.py
    test_clientes_invitados.py
    test_cobrado.py
    test_core.py
    test_correos_y_guia_automatica.py
    test_cotizaciones_y_prellenado.py
    test_cotizador.py
    test_cotizador_envios.py
    test_cupon_carrera.py
    test_director.py
    test_envios.py
    test_estres_envios.py
    test_etiquetas.py
    test_ficha_cliente.py
    test_fichas.py
    test_gracia_de_codigos.py
    test_guias.py
    test_marketing.py
    test_medicion_y_whatsapp.py
    test_meta_capi.py
    test_modelo_ia.py
    test_motor_precios.py
    test_paqueterias.py
    test_pedidos_de_prueba.py
    test_privacidad_distribuidor.py
    test_puntos.py
    test_rastreo.py
    test_regalos_y_carrito.py
    test_regla_de_5.py
    test_reportes_ads.py
    test_roles_marketing.py
    test_secretos.py
    test_texto_ia.py
    test_ve_datos_cliente.py
norecursedirs = .venv .venv.nosync .git __pycache__ templates tutorial_videos
