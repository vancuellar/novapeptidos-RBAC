# Composicion de produccion del backend de Exygen (EC2, /opt/exygen/app).
#
# Este archivo vive en el repo A PROPOSITO: antes se generaba a mano en el
# servidor (userdata) y nadie podia revisarlo ni versionarlo. Ahora cualquier
# cambio de infraestructura pasa por un commit.
#
# El despliegue NO se hace con "docker compose up" a pelo. Se hace con
# ./deploy.sh, que prueba la imagen nueva ANTES de apagar la que esta sirviendo.
#
# ---------------------------------------------------------------------------
#  DOS COLORES (azul / verde) — por que
# ---------------------------------------------------------------------------
#  Antes habia UN solo servicio "api" en el 8000. Cada despliegue lo apagaba y
#  lo volvia a arrancar: entre una cosa y la otra, la tienda contestaba error
#  durante unos segundos. Con varios agentes desplegando al dia, eso pasaba
#  varias veces al dia.
#
#  Ahora hay dos contenedores gemelos, en dos puertos distintos:
#
#      api-azul   ->  127.0.0.1:8001
#      api-verde  ->  127.0.0.1:8002
#
#  Solo UNO recibe trafico a la vez, y quien lo decide es LA PUERTA: el
#  servicio "puerta", un nginx diminuto que escucha en el 8010 (y en el 8000 de
#  siempre) y manda todo al color activo. El despliegue levanta el color
#  apagado, espera a que este SANO de verdad, y entonces reescribe una linea de
#  la puerta y le manda HUP. nginx aplica la configuracion nueva sin cerrar el
#  puerto: no se pierde ni una peticion. El color viejo se apaga despues,
#  pasado un periodo de gracia.
#
#  POR QUE UN NGINX Y NO RECARGAR CADDY: se midio. "systemctl reload caddy"
#  tumba conexiones sueltas (14 de 358 peticiones en 15 recargas). El HUP de
#  nginx no tumbo ninguna (600 peticiones, 20 recargas). Caddy sigue siendo la
#  entrada publica, pero apunta al 8010 y NO se toca en los despliegues.
#
#  Los tres servicios llevan "profiles" para que un "docker compose up -d" a
#  secas NO los recree de golpe. Se manejan siempre por deploy.sh.
# ---------------------------------------------------------------------------

# Los dos colores son EL MISMO contenedor. Se describe una sola vez aqui para
# que no puedan desincronizarse: si alguien cambia un volumen o el healthcheck,
# lo cambia para los dos a la vez.
x-api-comun: &api-comun
  build: .
  image: app-api:latest
  # "unless-stopped" en vez de "always": si alguien apaga el contenedor a
  # proposito (y deploy.sh apaga el color viejo a proposito), un reinicio del
  # servidor no lo revive por su cuenta.
  restart: unless-stopped
  env_file: .env
  environment:
    - COA_DIR=/data/coa
    - FICHA_DIR=/data/fichas
    - REPORTES_ADS_DIR=/data/reportes-ads
  volumes:
    # Los PDF de los certificados viven fuera del contenedor: se copian a
    # /opt/exygen/coa y se leen en cada consulta, sin volver a desplegar.
    - /opt/exygen/coa:/data/coa:ro
    # Las fichas tecnicas: mismo esquema que los COA. Se copian a
    # /opt/exygen/fichas y se leen sin volver a desplegar.
    - /opt/exygen/fichas:/data/fichas:ro
    # EL ARCHIVO DE REPORTES SEMANALES DE PUBLICIDAD (video + cifras de cada
    # semana). Este SI va de lectura y escritura: el pipeline publica aqui la
    # semana nueva. Fuera del contenedor a proposito — son ~15 MB por semana,
    # 780 MB al año, y meterlos en git o en la imagen seria cargarlos para
    # siempre. Los dos colores ven la MISMA carpeta, asi que el azul/verde no
    # se lleva nada por delante.
    - /opt/exygen/reportes-ads:/data/reportes-ads
  depends_on:
    - mongo
  # EL PUNTO CLAVE. Sin esto, un contenedor que arranca, revienta al importar
  # y vuelve a arrancar se ve como "Up" en docker ps: un ciclo de muerte
  # silencioso. Con el healthcheck se ve "unhealthy" y deploy.sh lo detecta.
  # La imagen es python:3.11-slim y NO trae curl ni wget: se usa urllib.
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - |
        import sys, urllib.request
        try:
            with urllib.request.urlopen("http://127.0.0.1:8000/api/", timeout=5) as r:
                sys.exit(0 if r.status == 200 else 1)
        except Exception:
            sys.exit(1)
    interval: 30s
    timeout: 10s
    retries: 3
    # El arranque real toma unos segundos (importa pandas/numpy y conecta a
    # mongo). Antes de este plazo un fallo no cuenta como "unhealthy".
    start_period: 60s
    # Mientras dura ese plazo se pregunta cada 2 segundos en vez de cada 30.
    # Asi el color nuevo se declara "healthy" a los pocos segundos de estar
    # listo, y el despliegue no tiene que esperar medio minuto de mas.
    start_interval: 2s
  # Un ciclo de reinicios llena el disco de logs en horas. El disco de esta
  # instancia es de 20 GB y ya va al 79%: sin tope, un crash-loop de una
  # noche la deja sin espacio y entonces ya no levanta ni el mongo.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodata:/data/db
    # Un mongo caido tambien tumba la tienda: que se note en "docker ps".
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api-azul:
    <<: *api-comun
    profiles: ["colores"]
    ports:
      - "127.0.0.1:8001:8000"

  api-verde:
    <<: *api-comun
    profiles: ["colores"]
    ports:
      - "127.0.0.1:8002:8000"

  # LA PUERTA. Lo unico que hace es mandar el trafico al color que toca. Su
  # configuracion (/opt/exygen/puerta/default.conf) la escribe deploy.sh y el
  # cambio de color se aplica con "docker kill -s HUP": nginx cambia de
  # configuracion SIN cerrar el puerto, asi que no se cae ni una peticion.
  #
  # "network_mode: host" a proposito: tiene que hablar con 127.0.0.1:8001 y
  # 127.0.0.1:8002, que son puertos del HOST (los colores se publican solo en
  # loopback, nunca hacia afuera). Con red propia no los alcanzaria.
  puerta:
    image: nginx:1.27-alpine
    profiles: ["colores"]
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/exygen/puerta:/etc/nginx/conf.d:ro
    healthcheck:
      # La imagen de nginx no trae curl, pero si el wget de busybox.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8010/api/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongodata:
